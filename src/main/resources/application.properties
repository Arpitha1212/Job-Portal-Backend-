spring.application.name=jobportal

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/jobportaldb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Public Key Retrieval is not allowed


# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
# spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
logging.level.org.springframework.security=DEBUG
# Optional
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.tool.schema=DEBUG

spring.jpa.properties.hibernate.default_batch_fetch_size=${spring.jpa.properties.hibernate.jdbc.batch_size:50}

# Spring security
spring.security.user.name=arpitha
spring.security.user.password=arpitha@12
spring.security.user.roles=USER,ROLES